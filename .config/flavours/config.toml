# If start and end aren't specified, the default is
# start = "# Start flavours"
# end = "# End flavours"
# These are case-insensitive whether it's the default one or a custom one
# If instead of start and end, you want to rewrite the entire file, use rewrite = true

# `flavours update all` was not updating the templates when I did it, so you may need to run `flavours update templates too`
# Templates that are not specified in this repo are pulled from that

#  _   _____                        
# (_) |___ /  __      __  _ __ ___  
# | |   |_ \  \ \ /\ / / | '_ ` _ \ 
# | |  ___) |  \ V  V /  | | | | | |
# |_| |____/    \_/\_/   |_| |_| |_|
[[items]]
file = "~/.config/i3/config"
template = "i3"
subtemplate = "colors"
hook = "i3-msg restart" # technically reload is faster and works, but i3blocks needs restart

[[items]]
file = "~/.config/i3blocks/config"
template = "i3blocks"
rewrite = true

#  _      _   _     _           
# | | __ (_) | |_  | |_   _   _ 
# | |/ / | | | __| | __| | | | |
# |   <  | | | |_  | |_  | |_| |
# |_|\_\ |_|  \__|  \__|  \__, |
#                         |___/ 
[[items]]
file = "~/.config/kitty/kitty.conf"
template = "kitty"
